spring:
  application:
    name: cyberflora-backend

  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"

  datasource:
    url: "jdbc:postgresql://127.0.0.1:5432/${POSTGRES_DB:cyberflora}"
    username: "${POSTGRES_USER:cyberflora_user}"
    password: "${POSTGRES_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: "${JWT_SECRET:}"
  expiration-ms: 7200000
mqtt:
  enabled: "${MQTT_ENABLED:true}"
  broker-url: "${MQTT_BROKER_URL:tcp://127.0.0.1:1883}"
  username: "${MQTT_USERNAME:cyberflora_backend}"
  password: "${MQTT_BACKEND_PASSWORD:}"
  client-id: cyberflora-backend
  topic: "cyberflora/+/sensor/+"