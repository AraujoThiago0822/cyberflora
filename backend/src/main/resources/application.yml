spring:
  application:
    name: cyberflora-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/cyberflora
    username: cyberflora_user
    password: cyberflora_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080