# CyberFlora - broker MQTT
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Sem acesso anonimo: toda conexao precisa de usuario e senha
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Protecao contra mensagens gigantes (as leituras tem poucos bytes)
message_size_limit 4096

listener 1883